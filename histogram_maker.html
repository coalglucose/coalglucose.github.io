<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dotplot Maker</title>

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

    <link rel="stylesheet" href="page_style.css">
</head>

<body>

    <div id="scatter-maker">

        <div class="container">

            <h1>Scatterplot Maker</h1>

            <label>X Values</label>
            <input
                    type="text"
                    id="x-values"
                    placeholder="5, 10, 2.5, 9"
            >

            <button onclick="makePlot()">
                Create Histogram
            </button>

            <div id="graph"></div>

        </div>

    </div>

    <script src="histogram_maker.js"></script>

</body>
</html>
